version: 2

# Grouped updates. Republishing the repo made every dependency look new at
# once, which opened 30 individual PRs — permanent noise for a single-maintainer
# project. Grouping collapses each ecosystem into one PR per run: routine
# patch/minor bumps arrive together and can be reviewed as a batch, while major
# bumps stay separate because those are the ones that actually need reading.

updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      backend-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      backend-major:
        patterns: ["*"]
        update-types: ["major"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Raise when typescript-eslint's typescript peer cap rises. Its peer range
      # is ">=4.8.4 <6.1.0" (checked 2026-11-28, typescript-eslint 8.74.0), so
      # TypeScript 6.1+ and 7 fail `npm ci` with ERESOLVE. 6.0.x is fine.
      # https://github.com/typescript-eslint/typescript-eslint/blob/main/packages/typescript-eslint/package.json
      - dependency-name: typescript
        versions: [">=6.1.0"]
    groups:
      frontend-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      frontend-major:
        patterns: ["*"]
        update-types: ["major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]

  # Dockerfile base images are digest-pinned FROM lines; without this entry the
  # digests never refresh (the old node:20 pin sat unchanged for months).
  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      frontend-images:
        patterns: ["*"]
    # The Node major follows frontend/.nvmrc, which CI tests; Dependabot does
    # not edit that file, so a major here would ship an untested Node. Raise
    # it with .nvmrc in one reviewed change. Digest refreshes still come.
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      backend-images:
        patterns: ["*"]
    # CI tests Python 3.12 ("Backend (Python 3.12 + Postgres 16)") and the
    # hash locks are compiled for it, so a new Python minor (3.12 to 3.15) must
    # move with CI and the locks in one reviewed change. Patches and digest
    # refreshes still come.
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      images:
        patterns: ["*"]
