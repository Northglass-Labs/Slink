<svg xmlns="http://www.w3.org/2000/svg" width="200" height="60" viewBox="0 0 200 60" fill="none">
  <defs>
    <filter id="logo-glow-soft" x="-60%" y="-60%" width="220%" height="220%" color-interpolation-filters="sRGB">
      <feFlood flood-opacity="0" result="BackgroundImageFix"/>
      <feBlend in="SourceGraphic" in2="BackgroundImageFix" result="shape"/>
      <feGaussianBlur stdDeviation="4" result="effect1_foregroundBlur"/>
    </filter>
    <filter id="logo-glow-core" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
      <feFlood flood-opacity="0" result="BackgroundImageFix"/>
      <feBlend in="SourceGraphic" in2="BackgroundImageFix" result="shape"/>
      <feGaussianBlur stdDeviation="2.5" result="effect1_foregroundBlur"/>
    </filter>
    <mask id="logo-shape-mask" maskUnits="userSpaceOnUse">
      <path fill="white"
        d="M30 4
           L44 14
           L48 30
           L44 46
           L30 56
           L16 46
           L12 30
           L16 14
           Z"
      />
    </mask>
  </defs>

  <!-- Icon: geometric diamond eye -->
  <path
    d="M30 4
       L44 14
       L48 30
       L44 46
       L30 56
       L16 46
       L12 30
       L16 14
       Z"
    fill="#1a9e8f"
  />

  <!-- Glow effects inside icon shape -->
  <g mask="url(#logo-shape-mask)">
    <g filter="url(#logo-glow-soft)">
      <ellipse cx="30" cy="30" rx="20" ry="8" fill="#b8f5ee"/>
    </g>
    <g filter="url(#logo-glow-core)">
      <ellipse cx="18" cy="30" rx="7" ry="4" fill="#2ed9c3"/>
    </g>
    <g filter="url(#logo-glow-core)">
      <ellipse cx="42" cy="30" rx="7" ry="4" fill="#2ed9c3"/>
    </g>
    <g filter="url(#logo-glow-core)">
      <ellipse cx="30" cy="30" rx="5" ry="5" fill="#b8f5ee"/>
    </g>
  </g>

  <!-- Eye slit cutout -->
  <path
    d="M30 23
       C38 23 46 27.5 46 30
       C46 32.5 38 37 30 37
       C22 37 14 32.5 14 30
       C14 27.5 22 23 30 23
       Z"
    fill="#0a1628"
  />

  <!-- Iris ring -->
  <circle cx="30" cy="30" r="5.5" fill="none" stroke="#2ed9c3" stroke-width="1.5"/>

  <!-- Pupil -->
  <circle cx="30" cy="30" r="2.5" fill="#2ed9c3"/>

  <!-- Highlight -->
  <circle cx="30" cy="30" r="1" fill="#b8f5ee"/>

  <!-- Wordmark: SLINK -->
  <!-- Using font-family Inter, weight 600, letter-spacing tight -->
  <text
    x="64"
    y="39"
    font-family="Inter, 'SF Pro Display', system-ui, -apple-system, sans-serif"
    font-size="22"
    font-weight="600"
    letter-spacing="0.12em"
    fill="#2ed9c3"
  >SLINK</text>
</svg>
