apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: slink
  annotations:
    # If you use cert-manager, uncomment + edit:
    # cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - slink.example.com
      secretName: slink-tls
  rules:
    - host: slink.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: slink-api
                port:
                  number: 8000
          - path: /docs
            pathType: Prefix
            backend:
              service:
                name: slink-api
                port:
                  number: 8000
          - path: /openapi.json
            pathType: Prefix
            backend:
              service:
                name: slink-api
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: slink-frontend
                port:
                  number: 80
