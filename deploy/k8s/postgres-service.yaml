apiVersion: v1
kind: Service
metadata:
  name: slink-postgres
  labels:
    app.kubernetes.io/component: db
spec:
  type: ClusterIP
  clusterIP: None   # headless — required by StatefulSet stable network identity
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
  selector:
    app.kubernetes.io/component: db
