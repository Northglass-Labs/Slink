{{- if .Values.migrate.enabled }}
{{/*
Pre-install + pre-upgrade hook running `alembic upgrade head`. Slink ships
migrations inside the api image, so we re-use that image for the job.

`hook-delete-policy: before-hook-creation,hook-succeeded` keeps the most
recent failed run around for `kubectl logs` debugging while pruning succeeded
ones automatically.
*/}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "slink.migrate.fullname" . }}
  labels:
    {{- include "slink.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrate.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.migrate.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "slink.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "slink.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.api.podSecurityContext | nindent 8 }}
      containers:
        - name: alembic
          image: {{ include "slink.image" (dict "image" .Values.api.image "global" .Values.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.api.securityContext | nindent 12 }}
          command: ["alembic", "upgrade", "head"]
          envFrom:
            {{- include "slink.envFrom" . | nindent 12 }}
          resources:
            {{- toYaml .Values.migrate.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
